# Serves the built frontend and answers "does this address exist?" — the one
# question nginx can answer that the page itself cannot.
#
# The site is a single page: every address returns index.html and the router
# picks the screen. That means nginx has no idea whether /about or /halo is a
# real page, so it used to answer 200 for both, and a missing address looked
# healthy to crawlers and uptime checks.
#
# A wrong address also rendered the wrong thing: index.html plus whatever path
# the visitor typed, so the page's relative asset URLs (/assets/...) resolved
# under /halo/. With an asset that does not exist, the browser got index.html
# back with the wrong content type and ran it as JavaScript.
#
# The lists below are the addresses the router knows. An address outside them is
# answered 404 with index.html as the body: the page still renders the
# "halaman tidak ada" screen, but the status line says what is true.
server {
  listen 5173;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # The public pages, exactly as App.jsx declares them. Keep the two in step:
  # a page added to the router and not here answers 404 for its own screen.
  location ~ ^/(|about|portfolio|packages|latest|booking|contact|privacy|terms|terms-and-conditions)$ {
    try_files $uri /index.html;
  }

  # The client photo page, opened from the e-mail link: /pilih/{token}. A token
  # is 32 to 64 hex characters; a shorter one is not a page, so /pilih answers
  # 404 instead of showing a screen that can only fail.
  location ~ "^/pilih/[a-f0-9]{32,64}/?$" {
    try_files $uri /index.html;
  }

  # The admin panel, behind its own login. Its sub-pages are client-side, and a
  # mistyped one renders the admin 404 — with the router's own 404 status.
  location ~ ^/admin(/.*)?$ {
    try_files $uri /index.html;
  }

  # The admin PWA files. Exact matches so the manifest keeps its proper type and
  # the service worker is revalidated on every visit: a stale worker would keep
  # an old panel installed for as long as the browser kept the file.
  location = /admin/manifest.json {
    types { application/manifest+json json; }
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /admin/sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Everything else does not exist, and the answer is a real 404 whose body is
  # index.html, so the page still renders "halaman tidak ada".
  #
  # try_files cannot do this: when its last fallback is a file that exists,
  # nginx serves it and an =404 beside it is ignored, so every wrong address
  # stayed 200. An internal error_page names a location that is only reachable
  # that way and does nothing but set the status; index.html is served from here
  # and the status is kept.
  location / {
    error_page 404 /__status_404;
    try_files $uri =404;
  }

  location = /__status_404 {
    internal;
    add_header Cache-Control "no-store";
    try_files /index.html =404;
  }
}
