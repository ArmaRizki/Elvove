# The main nginx configuration, replacing the one nginx:alpine ships.
#
# Only one line differs from the image's own file — worker_connections — and it
# is here for a reason the stock file cannot carry.
#
# The stock file allows 1024 connections per worker. The client photo page
# opens a preview per photo at once, for a folder of a few hundred (see the
# gallery locations in default.conf, which stream those previews instead of
# buffering them to disk). 1024 is below that: a worker that runs out cannot
# accept the next connection and answers 503 for every visitor at once, which
# is the failure this file prevents. 16384 is what Java's Undertow-based setup
# handled comfortably before this migration.
#
# Every descriptor a worker can use has to come from the container's own limit,
# so compose.yml raises `nofile` to match (see the nginx service there). One
# without the other does nothing: this line is a promise nginx makes to itself,
# and the ulimit is the permission the container gives it.
#
# Keep the rest of this file in step with nginx:alpine. When the image's default
# changes, this file stays behind until it is updated by hand.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    # Raised from the image's 1024; see the note at the top of this file.
    worker_connections  16384;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
