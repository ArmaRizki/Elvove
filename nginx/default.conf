limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=booking:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
# The client photo page opens a preview per photo at once, for a folder of a few
# hundred. Each one streams instead of being buffered (see the gallery location);
# with the stock "1024 connections, buffers that spill to temp files" those
# previews exhausted the worker's file descriptors and were answered 503.
limit_req_zone $binary_remote_addr zone=gallery:10m rate=600r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# WebSocket upgrade only when the browser asks for one. Sending
# "Connection: upgrade" on every request makes the Vite 8 dev server hang on
# plain page loads, which nginx then reports as 502.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version in error pages and the Server header.
    server_tokens off;

    # Baseline security headers. They are set here, once, so every proxied
    # response (API, uploads, SPA) carries them. No location below sets its own
    # add_header, which would otherwise discard these inherited values.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Matches the backend's UPLOAD_MAX_REQUEST_SIZE. nginx answers 413 before
    # the request ever reaches the backend.
    client_max_body_size 100M;

    # The backend sets its own X-Frame-Options / X-Content-Type-Options on some
    # responses; drop those copies so each response carries exactly one set of
    # values, the ones defined above.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;

    location /api/auth/ {
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /api/bookings {
        limit_req zone=booking burst=3 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 20;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/gallery/ {
        limit_req zone=gallery burst=120 nodelay;
        limit_req_status 429;
        # Behind the tunnel every visitor shares one source address, so a limit
        # sized for one browser turned a folder page into 503s for everyone.
        limit_conn conn_per_ip 120;
        # A preview is built the first time a photo is opened: the original is
        # downloaded from Drive and converted. The 60 s default cut that off
        # half-way on a folder of large photos, leaving broken images.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # The page lists the photos and then opens a preview of each one, so the
        # burst is the whole folder. A preview is also the largest response the
        # site sends: buffering a few hundred of them at once is what exhausted
        # the worker's file descriptors and answered 503. Stream each one after
        # the first 32 KB instead, which also shows the photo sooner.
        proxy_max_temp_file_size 0;
        proxy_buffering on;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # The folder backfill walks every booking and may run for minutes; without
    # this nginx would answer 504 after its 60 s default while the work goes on.
    location = /api/admin/drive/backfill {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 20;
        proxy_read_timeout 600s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 20;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        limit_conn conn_per_ip 40;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
