limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version in error pages and the Server header.
    server_tokens off;

    # Baseline security headers. They are set here, once, so every proxied
    # response (API, uploads, SPA) carries them. No location below sets its own
    # add_header, which would otherwise discard these inherited values.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Matches spring.servlet.multipart.max-request-size (UPLOAD_MAX_REQUEST_SIZE).
    # nginx answers 413 before the request ever reaches Spring.
    client_max_body_size 100M;

    # Spring Security writes its own X-Frame-Options / X-Content-Type-Options on
    # backend responses; drop those copies so each response carries exactly one
    # set of values, the ones defined above.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;

    location /api/auth/ {
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
