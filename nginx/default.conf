limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=booking:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
# The client photo page loads a thumbnail per photo at once, so it needs a much
# larger burst than the API in general; the browser then caches each one.
limit_req_zone $binary_remote_addr zone=gallery:10m rate=600r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# WebSocket upgrade only when the browser asks for one. Sending
# "Connection: upgrade" on every request makes the Vite 8 dev server hang on
# plain page loads, which nginx then reports as 502.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version in error pages and the Server header.
    server_tokens off;

    # Baseline security headers. They are set here, once, so every proxied
    # response (API, uploads, SPA) carries them. No location below sets its own
    # add_header, which would otherwise discard these inherited values.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Matches the backend's UPLOAD_MAX_REQUEST_SIZE. nginx answers 413 before
    # the request ever reaches the backend.
    client_max_body_size 100M;

    # The backend sets its own X-Frame-Options / X-Content-Type-Options on some
    # responses; drop those copies so each response carries exactly one set of
    # values, the ones defined above.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;

    location /api/auth/ {
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /api/bookings {
        limit_req zone=booking burst=3 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 20;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/gallery/ {
        limit_req zone=gallery burst=120 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 40;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # The folder backfill walks every booking and may run for minutes; without
    # this nginx would answer 504 after its 60 s default while the work goes on.
    location = /api/admin/drive/backfill {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 20;
        proxy_read_timeout 600s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 20;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        limit_conn conn_per_ip 40;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
